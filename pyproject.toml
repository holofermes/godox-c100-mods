[project]
name = "godox-c100-mods"
version = "0.1.0"
description = "Patches for the Godox C100 camera firmware"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
test = ["unicorn>=2"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
